name: CI

# Basic checks only, to keep GitHub Actions minutes low: pull requests and
# manual runs. E2E, container and timezone checks run locally (see README).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_APP_NAME: PTA Web
  VITE_APP_URL: http://localhost:5173
  VITE_API_URL: http://localhost:3001
  OPENSPEC_TELEMETRY: 0

jobs:
  quality:
    name: Format, verify, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # typecheck, lint, unit tests, OpenSpec validation, and skills check.
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build
