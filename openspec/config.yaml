schema: spec-driven

context: |
  Stack: Vite, React, TypeScript, TanStack Query, Zod, Vitest, Testing
  Library, MSW, and Playwright.
  Default language for artifacts: English.
  Directories under specs/ and changes/ must match a business capability
  (e.g., `example`). When a matching feature exists under
  src/features/<feature>, reuse that exact name. Never group by route,
  component, or hook name.
  Every specified scenario must be converted into an automated test
  by the developer before implementation.

  Domain: DistriLux is an electrical materials distributor in Recife that
  sells on credit to about 120 companies in eight Northeast states. This
  repository is the web portal of its internal order system: sellers find
  clients of their own portfolio and build orders; the sales manager sees
  every client, the dashboard, contracts and clients at risk of churn; the
  finance person approves orders above the credit limit; the administrator
  manages users and the ERP synchronization. The portal talks only to its
  own API, never to the ERP. Money comes in cents and is shown as
  R$ 1.234,56; the available credit can be negative. Permissions are
  enforced by the server from the signed-in user. Business rules (RN-01 to
  RN-20) come from the PRD "DistriLux Portal de Pedidos"; the visual
  standard is DESIGN.md at the repository root.
  Interface text is in Brazilian Portuguese.

rules:
  proposal:
    - Explain the impact on business, security, and the API contract.
    - Declare in-scope and out-of-scope items.

  specs:
    - Describe only observable behavior.
    - Use SHALL or MUST in requirements.
    - Every requirement must have at least one testable scenario.
    - Do not mention components, hooks, or implementation details.

  design:
    - Record decisions, rejected alternatives, and trade-offs.
    - Create an ADR when the decision is cross-cutting, hard to reverse, or affects more than one feature.

  tasks:
    - Organize tasks into SDD, Red, Green, Refactor, and Consolidation phases.
    - Include an explicit task for the developer to write tests.
    - Include test execution, typecheck, and strict OpenSpec validation.

operations:
  archive:
    guidance:
      - Before archiving, check if docs/changes/<change-id>.md exists.
      - Create or update docs/changes/<change-id>.md with the objective, change made, validations executed, result, and links to the change.
      - Evaluate if there was a relevant architectural decision.
      - If so, create an ADR in docs/adr/ following docs/adr/README.md.
      - Never create an ADR for local, reversible changes without relevant trade-offs.
      - Only archive after tests, typecheck, lint, and openspec validate --strict have passed.
      - Obtain explicit user confirmation immediately before moving the change to the archive. Confirmation of validation warnings or spec synchronization does not count as confirmation to archive.
